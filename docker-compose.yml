# T&C AI Academy — PostgreSQL deployment.
#
# Before the first `docker compose up`, set `provider = "postgresql"` in
# prisma/schema.prisma and run `npm run db:migrate` once locally to generate the
# PostgreSQL migration. See docs/DEPLOYMENT.md.
#
# For the single-server SQLite deployment, run the app service alone with
# DATABASE_URL="file:/data/academy.db" and drop the db service and depends_on.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcai
      POSTGRES_USER: tcai
      # Set POSTGRES_PASSWORD in a .env file next to this compose file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcai -d tcai"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the app container reaches the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tcai:${POSTGRES_PASSWORD}@db:5432/tcai?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      # Optional — leave unset to keep the AI layer switched off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - app-storage:/data/storage
    ports:
      - "3000:3000"

volumes:
  db-data:
  app-storage:
